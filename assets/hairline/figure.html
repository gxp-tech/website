<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hairline figure</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; --ground: #ffffff; --ink: #232327; --muted: #6f6f78; --line: #e0e0e4; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #play[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #means { margin: 14px 0 0; min-height: 39px; min-height: 2lh; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; min-height: 35.2px; min-height: 2lh; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
<style id="hl-embed">
  html,body{height:100%!important;overflow:hidden!important;background:var(--ground)!important}
  body{padding:0!important;min-height:0!important;display:block!important}
  main{max-width:none!important;width:100%!important;margin:0!important}
  .plate{border:0!important;border-radius:0!important}
  .plate>svg, #stage>svg{display:block!important;width:100%!important;height:auto!important}
  .tag{opacity:.5!important}
  .controls,#means,#rules,#error,#name{display:none!important}
</style></head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
    <span class="label">play</span>
    <button id="play" type="button" aria-pressed="false">play</button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

        const d = (ring[i][0] - rx) * ax + (ring[i][1] - ry) * ay;
        if (d < near) { near = d; ino = i; }
      }
      if (ino < 0) return;
      /* and the horns are the plate's two widest points, one to each side of it */
      let ia = -1, ib = -1, va = -1e9, vb = 1e9;
      for (let i = 0; i < n; i++) {
        const t = (ring[i][0] - rx) * -ay + (ring[i][1] - ry) * ax;

        const cx = B[0] - A[0], cy = B[1] - A[1], L = Math.hypot(cx, cy) || 1;
        let nx = -cy / L, ny = cx / L;

        if (d0[m >> 1] < 0) { nx = -nx; ny = -ny; for (let j = 0; j < m; j++) d0[j] = -d0[j]; }

    return ring.map((q, i) => {
      const a = ring[(i - 1 + n) % n], b = ring[(i + 1) % n];
      const tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1;
      const u = s[i];
      const d = (flkField(u, 46, 1) * .55 + flkField(u, 30, 6) * .35 +

                 Math.pow(Math.max(0, flkField(u, 72, 7)), 2) * .90) * amp * wg[i];

  /* the grain the plate cannot carry: the margin's own fine roughness, three octaves of it,

     eased, because a hand leaves corners and a sine rounds them off, and the last of them is
     joined squared so that now and then a tooth stands out of the edge.  It is laid on the

     the same arc length as the swells, so the two are one edge and not two patterns on it. */

    (flkField(u, 13, 11, true) * .38 + flkField(u, 8, 13, true) * .44 +

    Math.pow(Math.max(0, flkField(u, 24, 19)), 2) * 4.4;

     negative aft, nought is the plan exactly where it was traced.  The shift is a
     translation of the finished ring, so every lobe, notch and free margin keeps its own
     form - the tail simply hands over at a different station.  Forward of the join the
     plate lies inside the hull and the frame's union trims it there; the things tied to
     the old station - the tail ridge's dissolve below, the fluke's own reach in the swim

     single contour of the hull and the plate painted together and a contour cannot carry a

     the edge it trails: a row of round beads, no two the same size, each sitting a bead's
     own width inside the margin so none of them breaks the plate's drawn line.  Where they

     turned inward by the margin's own normal, so the row follows the edge however the

  const FLKKNOBS = (() => {
    const ring = FLK.outline, n = ring.length;

    const gap = Array.from({ length: NK }, (_, k) => .5 + at(k * 7 + 3));

    const inRing = (x, y) => {

       round on either lobe, so a bead's place and its size mean the same thing on both.

       bead the other has not got would read as damage, and the pair is one plate. */
    const row = [];
    for (const idx of [walk(i0, notch), walk(notch, i1).reverse()]) {
      const m = idx.length;
      if (m < 12) { row.push(null); continue; }
      const cum = [0];
      for (let j = 1; j < m; j++)
        cum.push(cum[j - 1] + Math.hypot(ring[idx[j]][0] - ring[idx[j - 1]][0],
                                         ring[idx[j]][1] - ring[idx[j - 1]][1]));
      const tot = cum[m - 1] || 1;

      /* one bead on the margin, at arc length u, of the given index: the index is what the

      let prevN = null;
      const beadAt = (u, k) => {
        let j = 1;
        while (j < m - 1 && cum[j] < u) j++;

           off the plate's middle, which is where that answer is plainest.  Farther along,
           where the margin runs in to the notch, the middle of the plate is exactly what
           the notch has cut away: "toward the middle" turns the bead round into the
           cut - the normal flips, and no bead put there can be made to sit inside the
           ring.  So past the first bead the side is kept by continuity with the one

        let tx = B[0] - A[0], ty = B[1] - A[1];

      beads.push(beadAt(.955 * tot, NK));

  })();

  const DORSRING0 = [
    [606, 368, .07],                                     /* the root run, sunk in the hull */
    [620, 360, .95], [636, 352, 1], [652, 345, .99],     /* the long leading edge, barely climbing */

     the full tone the outline and the beads are cut in. */
  const finCreases = [0, 1].map((ci) =>
    Array.from({ length: 4 }, () => mk("path", { class: "nf", style: "stroke:var(--hl-hi);stroke-opacity:.7" }, ci ? gFar : gNear)));
  /* the tail's ridge line fades into the fluke's root instead of butting against it.
     The fade is a ramp of short runs, each a step thinner than the one before: a dozen
     steps so that no single joint reads as a jump, and the last of them is gone by the
     join.  Four steps were enough to see the line drop by a third at a time. */
  const RL = [1, .92, .85, .77, .69, .62, .54, .46, .38, .31, .23, .15, .08];
  const ridge = RL.map((o) => mk("path", { class: "nf", style: o < 1 ? `stroke-opacity:${o}` : "" }, gBody));
  /* the trunk's roundness at the tail: one centre ridge running from the tail junction
     forward to the hump in the middle of the tail, a flanking pair either side of it, and
     the same three on the belly.  These are form lines, not traced ink: each rides its own
     angle round the section, fades in and out at both ends, and the normal test keeps only
     the side facing the camera - so they read as the trunk's curvature, not as seams. */
  const FM = [1, .55, .28];
  const form = FM.map((o) => mk("path", { class: "nf", style: o < 1 ? `stroke-opacity:${o}` : "" }, gBody));
  /* the throat's pleats: eight grooves a side, riding the lower flanks from under the
     mouth seam back past the pectoral's leading edge, each a single unbroken run.  Aft
     of the chin they taper band by band - thinner and fainter, the way the real folds
     flatten out. */
  /* The fan is spaced along the skin, not across the section.  Spacing them by height
     (an even step in cos) holds the gaps even from the side but stretches the neck of the
     fan wide open the moment the eye comes round under the belly; an even step in angle
     does the opposite.  What the grooves actually are is ribs of skin, so they sit an
     even distance apart measured along the section itself - the ellipse's own arc length,
     taken at the throat where the fan is widest.
     One thing the arc alone gets wrong: the pair that closes the fan.  Both flanks run
     their grooves down to within a few degrees of the belly's mid-line, and there the two
     of them end up nose to nose - nearer to each other than any other pair in the row,
     which is what the eye picks out from below.  So the fan is closed one even interval
     short of the mid-line instead: the last groove on each side stands .975 pi round, a
     single step (eleven units) from its mirror across the belly, the same as every other
     step in the row, and the six between are laid off evenly along the arc in between.
     The per-groove drift added further down stays a hair, never enough to disturb that.
     The outer end of the fan is kept a step clear of the pectoral's seam rather than
     tucked under it: the topmost groove used to stand .565 pi round, a hair below the
     crease the fin's root is sewn onto, and when the blade came down through its stroke
     the two lines lay on each other and the groove read as leaking out of the flipper.
     The whole row is drawn in by the same fraction, so the fan still closes on .975 and
     still steps down evenly - only its outer boundary sits off the seam. */
  const PK = [.605, .6653, .7228, .7773, .8291, .879, .9274, .975];
  /* the taper is a curve, not steps: opacity and width ride one smooth envelope along
     each groove - faint into the jaw, full through the middle, easing away aft - so no
     band boundaries show.  Drawn as short segments, each a hair different from the next. */
  const pleatProfile = (f) => {
    const P = [[0, .06, .52], [.12, .84, .98], [.42, .9, 1], [.74, .58, .78],
               [.87, .27, .58], [.96, .07, .40], [1, 0, .28]];
    let a = P[0], b = P[P.length - 1];
    for (let k = 0; k < P.length - 1; k++) if (f >= P[k][0] && f <= P[k + 1][0]) { a = P[k]; b = P[k + 1]; break; }
    const t = (f - a[0]) / Math.max(1e-6, b[0] - a[0]);
    const e = t * t * (3 - 2 * t);
    return [a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
  };
  const PNS = 30;
  /* Each band is its own element, so the kernel's round cap lays a bead at every band
     joint - thirty bright dots strung along each groove, which at a hairline's width is
     the whole texture of the line.  Butt caps meet flush instead: the joint is a joint,
     not an ornament. */
  const pleat = PK.flatMap(() => Array.from({ length: PNS }, (_, j) => {
    const [o, w] = pleatProfile((j + .5) / PNS);
    return mk("path", { class: "nf",
      style: `stroke:var(--hl-hi);stroke-linecap:butt;stroke-opacity:${o.toFixed(3)};stroke-width:${w.toFixed(3)}` }, gBody);
  }));
  /* The mouth seam's aft fade.  The seam itself is one black stroke and stops at the
     gape's corner; past the corner the cheek's crease carries on toward the pectoral's
     seam, but it has no business arriving there at full ink - a cut end butting the
     fin's root reads as two unrelated lines.  So it goes the pleats' way: one banded
     run whose opacity and width ride a falling envelope, dissolving to nothing right
     where the fin takes hold.  Ink, not highlight - the seam is one of the blacks. */
  const seamFadeProfile = (f) => {
    const P = [[0, .95, 1], [.35, .55, .9], [1, 0, .6]];
    let a = P[0], b = P[P.length - 1];
    for (let k = 0; k < P.length - 1; k++) if (f >= P[k][0] && f <= P[k + 1][0]) { a = P[k]; b = P[k + 1]; break; }
    const t = (f - a[0]) / Math.max(1e-6, b[0] - a[0]);
    const e = t * t * (3 - 2 * t);
    return [a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
  };
  const SNS = 20;
  const seamFade = Array.from({ length: SNS }, (_, j) => {
    const [o, w] = seamFadeProfile((j + .5) / SNS);
    return mk("path", { class: "nf",
      style: `stroke:var(--ink);stroke-opacity:${o.toFixed(3)};stroke-width:${w.toFixed(3)}` }, gBody);
  });
  /* The seam's other end, at the snout: the same banded run the other way up - full ink
     a hand's width short of the point, then thinner and fainter until the pen lifts.
     One set of bands serves both flanks; each arm feeds them from its own side. */
  const TNS = 12;
  const seamTip = Array.from({ length: TNS }, (_, j) => {
    const e = (j + 1) / TNS, q = e * e * (3 - 2 * e);
    return mk("path", { class: "nf",
      style: `stroke:var(--ink);stroke-linecap:round;stroke-opacity:${(1 - q).toFixed(3)};stroke-width:${(1 - .45 * q).toFixed(3)}` }, gBody);
  });
  /* The dorsal last of all, inked once.  Like the wing it is a solid: the fin stands on
     the hull with its root inside it, and everything it stands in front of - the trunk's
     own back line above all - is cut away by the fin's faces rather than covered up. */
  const dorsOut = mk("path", { class: "nf", style: "stroke:var(--ink)" }, gBody);
  /* the fin's other margin, drawn inside the first: the frame paints the slab's two faces
     and hands back one contour, so however solid the slab is the eye receives the
     silhouette of a card.  This is the line that says plate - the inner face's margin
     running parallel down the leading edge and ending on the skin, the way the airplane's
     tail is drawn. */
  const dorsEdgeOut = mk("path", { class: "nf", style: "stroke:var(--ink)" }, gBody);
  /* the fluke, inked the same way: one line off its slab, its root cut away where the
     peduncle takes hold, and whatever it stands in front of cut away from behind it */
  const flkOut = mk("path", { class: "nf", style: "stroke:var(--ink)" }, gBody);
  /* the tail's beads, one element each, set at the draw site where the plate's own sheet
     exists: they ride the swim wave and turn with the tail, the way the flippers' beads
     ride the blades */
  const flkKnobs = FLKKNOBS.map(([, , , op]) =>
    mk("path", { class: "hi nf", style: `stroke-opacity:${op.toFixed(2)}` }, gBody));

  /* the two leading-edge strokes, made at the site where the plate's own sheet exists, so
     they ride the swim wave and swing with the tail.  Each is laid in a ramp of inks, not
     one: a stroke that simply stops reads as a cut edge of its own, and the fluke's
     structure lines are meant to dissolve into the plate at both ends the way the tail's
     form lines do.  Six steps, each a shade paler, so no single joint shows. */
  const FLKOP = [.62, .5, .4, .31, .24, .17, .11, .06];
  const flkLead = [0, 1].map(() =>
    FLKOP.map((o) => mk("path", { class: "nf",
      style: `stroke:var(--hl-edge);stroke-opacity:${o.toFixed(2)}` }, gBody)));

  /* 800 stations: dense enough that the sampled sections tile the projection solidly at
     every angle - sparse stations project to a comb of disjoint slivers, whose column
     envelope saw-tooths - and cheap enough to redo each frame.  The last quarter of the
     body takes a denser share (40% of the samples over 25% of the length): out there
     shutW has shrunk the sections to slivers, and even spacing that tiles the fat
     mid-body still leaves gaps between them in projection. */
  const NSTA = 800, NPHI = 36;
  const stations = Array.from({ length: NSTA }, (_, i) => {
    const t = i / (NSTA - 1);
    /* piecewise-linear remap: [0,.75] -> [0,.6], [.75,1] -> [.6,1].  Continuous, and
       the tail quarter gets 1.67x the front's density - without the pile-up a single
       exponent makes (a previous attempt multiplied the slope past the domain end and
       clamped a ninth of the stations onto XE itself). */
    const tAdj = t < .75 ? (t / .75) * .6 : .6 + ((t - .75) / .25) * .4;
    return xa + (XE - xa) * tAdj;
  });

  /* ---- solids, and the aeroplane's way of hiding what stands behind them ----
     The frame here is ink, but each appendage is also a real slab in space: two faces held
     apart by its own thickness, its root run sunk inside the hull.  Every face is projected
     once a frame as a fan of triangles, and any stroke that falls behind one is cut away -
     the aeroplane's hidden-line pass, done in the plane.  So a fin draws itself out of the
     body's own lines: the trunk's frame stops at the fin's edge instead of running across
     its root, and the fin's outline stops where the hull swallows it.  No mask, no ground
     fill, nothing to cover up what should simply not be drawn. */
  let tris = [], P = null, flkArea = null, slabBits = [], finNearPoly = null, finNearBB = null;
  /* the same blade as a *cover*: its traced ring closed across the root, which is what the
     trunk's grooves have to break on.  Separate from finNearPoly, which is the outline the
     eye reads and which the frame's own cut is snapped to. */
  let finCutPoly = null, finCutBB = null;
  /* the standing fin's own outline as the eye gets it, page points with their depth: the
     one shape a stroke from behind it has to break on.  Set where the leaf is drawn. */
  let leafPoly = null;
  /* The animal's own outline on the page, as the frame walks it.  The far blade hangs on
     the other side of the trunk, so every part of it the outline covers is behind the body
     and drawn nowhere: a crease of that blade may only show where the blade itself clears
     the trunk - the one test the depth grid cannot make, because its cells read the near
     skin and let the far blade's strokes through wherever a cell happens to be a hole. */
  let bodyRing = null;
  /* A detail laid within a stroke of the frame runs alongside it for several units.
     The two strokes end on different subpixels and the eye reads a second,
     wavering outline.  Every skin marking - the seam, the stipple, the tubercles
     and the pleats - answers this same test against the frame. */
  const nearFrame = (q, m) => {
    if (!bodyRing) return false;
    const nR = bodyRing.length;
    for (let i = 0; i < nR; i++) {
      const a = bodyRing[i], b = bodyRing[(i + 1) % nR];
      const ex = b[0] - a[0], ey = b[1] - a[1], L2 = ex * ex + ey * ey || 1e-9;
      let t = ((q[0] - a[0]) * ex + (q[1] - a[1]) * ey) / L2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = q[0] - a[0] - ex * t, dy = q[1] - a[1] - ey * t;
      if (dx * dx + dy * dy < m * m) return true;
    }
    return false;
  };
  /* the dorsal blade's visible ink, its depths, and the shape its own line closes.  Read
     while the frame is being cut - the outline has to know what stands in front of it -
     and drawn again further down, when the fin's stroke is laid on the page. */
  let dorsInk = null, dorsFeet = null, dorsInkCells = null;
  /* how close the frame's own line may come to the blade's before the two read as one line
     drawn twice, and the screen cell the blade's margin is bucketed in for that test */
  const DORSTOL = 1.15, DORS_CELL = 8;
  /* the same ring as the pen lays it down (grained): fin feet are read onto this one */
  let bodyLine = null;
  /* the fins' drawn outlines, kept as polylines: the frame's cut of the silhouette ends
     on these lines, so fin and body part company exactly on the stroke they share */
  /* inside the plate's footprint on the page: a ray-crossing count, either face */
  const inPoly = (ring, x, y) => {
    let hit = 0;
    for (let i = 0, n = ring.length, j = n - 1; i < n; j = i++) {
      const a = ring[i], b = ring[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) hit++;
    }
    return (hit & 1) === 1;
  };
  const inFlk = (x, y) => !!flkArea && (inPoly(flkArea[0], x, y) || inPoly(flkArea[1], x, y));
  const dep = (w) => -(w[0] * VD[0] + w[1] * VD[1] + w[2] * VD[2]);   /* smaller is nearer */
  const pq = (w) => { const q = P(w[0], w[1], w[2]); return [q[0], q[1], dep(w)]; };
  /* sunk counts how many of the face's own corners lie inside the hull's skin: a blade's
     root chord is sunk into the flank there, and its faces hang across the body's edge
     with no line of their own drawn.  The grooves read that count - a face that is mostly
     swallowed may not scoop them out. */
  const addTri = (a, b, c, sunk = 0) => {
    const det = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
    if (Math.abs(det) < .03) return;
    tris.push({ a, b, c, det, sunk,
      minX: Math.min(a[0], b[0], c[0]), maxX: Math.max(a[0], b[0], c[0]),
      minY: Math.min(a[1], b[1], c[1]), maxY: Math.max(a[1], b[1], c[1]) });
  };
  /* a plate's interior, cut into triangles once and for all.  A fan round the centroid
     would spill across the sickle's own hollow - and whatever it spilled over would be
     hidden behind a fin that is not there.  Ear clipping keeps the hollow hollow.  The
     topology never changes, so this is solved at mount, not per frame. */
  const earClip = (pts, step) => {
    const keep = [];
    for (let i = 0; i < pts.length; i += step) keep.push(i);
    const src = keep.map((i) => pts[i]);
    const n = src.length;
    let area = 0;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      area += src[i][0] * src[j][1] - src[j][0] * src[i][1];
    }
    const idx = [...Array(n).keys()];
    if (area < 0) idx.reverse();
    const cr = (a, b, c) => (src[b][0] - src[a][0]) * (src[c][1] - src[a][1])
                           - (src[b][1] - src[a][1]) * (src[c][0] - src[a][0]);
    const tri = [];
    let guard = 0;
    while (idx.length > 3 && guard++ < 6000) {
      let cut = false;
      for (let i = 0; i < idx.length; i++) {
        const L = idx.length;
        const a = idx[(i - 1 + L) % L], b = idx[i], c = idx[(i + 1) % L];
        if (cr(a, b, c) <= 0) continue;
        let ok = true;
        for (const j of idx) {
          if (j === a || j === b || j === c) continue;
          if (cr(a, b, j) > 0 && cr(b, c, j) > 0 && cr(c, a, j) > 0) { ok = false; break; }
        }
        if (!ok) continue;
        tri.push([a, b, c]);
        idx.splice(i, 1);
        cut = true;
        break;
      }
      if (!cut) break;
    }
    for (let i = 1; i + 1 < idx.length; i++) tri.push([idx[0], idx[i], idx[i + 1]]);
    return { keep, tri };
  };
  const weights = (t, p) => {
    const u = ((t.b[1] - t.c[1]) * (p[0] - t.c[0]) + (t.c[0] - t.b[0]) * (p[1] - t.c[1])) / t.det;
    const v = ((t.c[1] - t.a[1]) * (p[0] - t.c[0]) + (t.a[0] - t.c[0]) * (p[1] - t.c[1])) / t.det;
    /* the fourth weight is the face's depth read at the point's pixel minus the point's
       own, and it must count as hidden when the face is the NEARER of the two - the
       comment on the spans below says as much.  dep grows away from the eye, so the
       point minus the face is the one that goes positive when the face stands in front.
       The sign had been the other way round, which let a face BEHIND the skin cut the
       very lines that stand in front of it: the far flipper threw its shadow across the
       mouth and the throat's grooves at every angle its blade crossed them in the page,
       and the strokes broke off along a diagonal with nothing drawn in the gap. */
    return [u, v, 1 - u - v, p[2] - (u * t.a[2] + v * t.b[2] + (1 - u - v) * t.c[2]) - .03];
  };
  /* the stretches of a stroke the eye can still see: everything else has a face in front */
  const visible = (a, b, oc) => {
    let spans = [[0, 1]];
    for (const t of oc) {
      if (!spans.length) break;
      if (Math.max(a[0], b[0]) < t.minX || Math.min(a[0], b[0]) > t.maxX) continue;
      if (Math.max(a[1], b[1]) < t.minY || Math.min(a[1], b[1]) > t.maxY) continue;
      const wa = weights(t, a), wb = weights(t, b);
      let lo = 0, hi = 1;
      for (let i = 0; i < 4 && lo < hi; i++) {
        if (wa[i] < 0 && wb[i] < 0) { hi = -1; break; }
        if (wa[i] < 0) lo = Math.max(lo, wa[i] / (wa[i] - wb[i]));
        else if (wb[i] < 0) hi = Math.min(hi, wa[i] / (wa[i] - wb[i]));
      }
      if (hi <= lo) continue;
      spans = spans.flatMap(([s, e]) => hi <= s || lo >= e ? [[s, e]]
        : [...(s < lo ? [[s, lo]] : []), ...(e > hi ? [[hi, e]] : [])]);
    }
    return spans.filter(([s, e]) => e - s > 1e-4);
  };
  const clipSeg = (a, b, oc) => {
    let out = "";
    for (const [s, e] of visible(a, b, oc)) {
      out += "M" + (a[0] + (b[0] - a[0]) * s).toFixed(2) + "," + (a[1] + (b[1] - a[1]) * s).toFixed(2)
           + "L" + (a[0] + (b[0] - a[0]) * e).toFixed(2) + "," + (a[1] + (b[1] - a[1]) * e).toFixed(2);
    }
    return out;
  };
  /* the stretches of a segment that fall outside a closed outline - the blade's own shape,
     where a stroke has to stop at a line rather than at a face.  The box first: the blade
     covers a corner of the page, and a groove has hundreds of segments that never come
     near it. */
  const inBlade = (a, b) => {
    const bb = finNearBB;
    return !!bb && Math.max(a[0], b[0]) >= bb[0] && Math.min(a[0], b[0]) <= bb[2]
                && Math.max(a[1], b[1]) >= bb[1] && Math.min(a[1], b[1]) <= bb[3];
  };
  const inBox = (bb, a, b) => !!bb && Math.max(a[0], b[0]) >= bb[0] && Math.min(a[0], b[0]) <= bb[2]
                                   && Math.max(a[1], b[1]) >= bb[1] && Math.min(a[1], b[1]) <= bb[3];
  /* the stretches both of two cuts leave standing */
  const spanAnd = (u, v) => {
    const out = [];
    for (const [s1, e1] of u) for (const [s2, e2] of v) {
      const s = Math.max(s1, s2), e = Math.min(e1, e2);
      if (e - s > 1e-4) out.push([s, e]);
    }
    return out;
  };
  /* how far a point lies from the nearest edge of a closed outline - the blade's traced
     margin, read as a distance rather than as an inside/outside count, which a ring seen
     edge-on cannot answer */
  const polyEdgeDist = (poly, x, y) => {
    let best = 1e9;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      const ex = q[0] - p[0], ey = q[1] - p[1];
      const L2 = ex * ex + ey * ey || 1;
      let t = ((x - p[0]) * ex + (y - p[1]) * ey) / L2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = p[0] + ex * t - x, dy = p[1] + ey * t - y;
      const d2 = dx * dx + dy * dy;
      if (d2 < best) best = d2;
    }
    return Math.sqrt(best);
  };
  const outSpans = (a, b, poly, tol = 0) => {
    const n = poly.length, ts = [0, 1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    for (let i = 0; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      const ex = q[0] - p[0], ey = q[1] - p[1];
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((p[0] - a[0]) * ey - (p[1] - a[1]) * ex) / den;
      const u = ((p[0] - a[0]) * dy - (p[1] - a[1]) * dx) / den;
      if (t > 0 && t < 1 && u >= 0 && u <= 1) ts.push(t);
    }
    ts.sort((x, y) => x - y);
    const out = [];
    for (let i = 0; i < ts.length - 1; i++) {
      const s = ts[i], e = ts[i + 1];
      if (e - s < 1e-4) continue;
      const m = (s + e) / 2;
      const mx = a[0] + dx * m, my = a[1] + dy * m;
      /* A stretch that merely lies a stroke inside the blade's traced margin is not
         covered by the blade - it IS the margin, seen twice: the frame's edge runs along
         the fin's root where the fin grows out of it, and the ring's root chord closes
         behind that same edge.  Counted as inside, that hair of daylight cut the outline
         away for a dozen units at every phase the flipper swung near the flank, leaving
         the back broken in the middle of an unbroken body.  Only what stands properly
         inside the blade is the blade's to take. */
      if (!inPoly(poly, mx, my) || (tol > 0 && polyEdgeDist(poly, mx, my) < tol)) out.push([s, e]);
    }
    return out;
  };
  /* A groove is cut by the blade the eye sees: by the fins' faces, and by the shape the
     blade's own line closes.  The faces alone could not do it - their triangles fan back
     through the flank where no line is drawn, so a blade standing end-on scooped a blank
     hole out of the grooves, while a blade spread across the belly, ink on both margins
     and the grooves running straight through the leaf between them, hid nothing at all. */
  const clipBlade = (a, b, oc) => {
    const spans = visible(a, b, oc || []);
    let keep = inBlade(a, b) ? outSpans(a, b, finNearPoly) : [[0, 1]];
    if (keep.length && finCutPoly && inBox(finCutBB, a, b)) keep = spanAnd(keep, outSpans(a, b, finCutPoly));
    let out = "";
    for (const [s1, e1] of spans) for (const [s2, e2] of keep) {
      const s = Math.max(s1, s2), e = Math.min(e1, e2);

        for (let j = 1; j + 1 < run.length; j++)
          if (!run[j][2] && run[j - 1][2] && run[j + 1][2]) run[j][2] = 1;
        /* the ramp is read off the run's own length on the page, not off the sample index:
           the plate swings and foreshortens, and an index-driven fade would slide along
           the stroke as the tail turns.  Then each segment is laid in the ink its place
           earns, and a change of ink starts a new sub-path from the point it happened on,
           so no joint is left open. */
        let cum = 0;
        const arc = [0];
        for (let j = 1; j < run.length; j++) {
          cum += Math.hypot(run[j][0] - run[j - 1][0], run[j][1] - run[j - 1][1]);
          arc.push(cum);
        }
        const tot = cum || 1;
        const ink = (j) => {
          const f = Math.min(tot > 1e-6 ? arc[j] / (tot * FIN) : 0,
                             tot > 1e-6 ? (tot - arc[j]) / (tot * FOUT) : 0, 1);
          return f < .02 ? -1 : clamp(Math.floor((1 - f) * FLKOP.length), 0, FLKOP.length - 1);
        };
        const s = FLKOP.map(() => "");
        let seg = [], st = -1;
        const flush = () => { if (st >= 0 && seg.length > 1) s[st] += crOpen(seg); seg = []; st = -1; };
        for (let j = 0; j < run.length; j++) {
          if (!run[j][2]) { flush(); continue; }
          const t2 = ink(j);
          if (t2 < 0) { flush(); continue; }
          if (st >= 0 && t2 !== st) {
            const last = seg[seg.length - 1];
            flush();
            seg = [last];
          }
          seg.push([run[j][0], run[j][1]]);
          st = t2;
        }
        flush();
        for (let t = 0; t < FLKOP.length; t++) flkLead[i][t].setAttribute("d", chainD(s[t]));
      }
    }
    /* the root creases, cut the way the beads are: the near blade hides the far one's
       strokes, and a stroke that has folded onto the outline - the blade seen edge-on,
       both margins in one line - is dropped whole, or it prints as a burr on the edge it
       is riding.  Each stroke is also held inside its own blade's footprint, so a stroke
       of the far blade cannot print across the base of the standing fin.  What all of
       this has to leave alone is the flipper's beat: the strokes are creases in the
       blade's skin, they ride it through the whole stroke, and they are on the drawing
       from the top of the arc to the bottom of it. */
    for (let ci = 0; ci < finCreases.length; ci++) {
      /* Both faces of the blade, not just the nearer one.  The stroke is laid on
         whichever face came out nearer to the eye, but the two faces stand a calibre
         apart and their projections do not coincide - in particular near the root,
         where the sheet pinches and the span is shortest.  Asking one face alone made
         a stroke vanish whenever it happened to sit on the other one's shadow, which
         is exactly what the downstroke was doing to the top crease. */
      const own = ci ? finPolys[2] : finPolys[0];
      const own2 = ci ? finPolys[3] : finPolys[1];
      const inOwn = (x, y) => inPoly(own, x, y) || inPoly(own2, x, y);
      for (let i = 0; i < finCreases[ci].length; i++) {
        const pts = finCreasePts[ci][i];
        let out = "";
        if (pts) {
          let xa2 = 1e9, xb2 = -1e9;
          for (const q of pts) { if (q[0] < xa2) xa2 = q[0]; if (q[0] > xb2) xb2 = q[0]; }
          if (xb2 - xa2 >= 2.4) {
            let run = [];
            const flush = () => {
              if (run.length > 1) {
                let t = 0;
                for (let k = 1; k < run.length; k++) t += Math.hypot(run[k][0] - run[k - 1][0], run[k][1] - run[k - 1][1]);
                if (t > 2.8) out += crOpen(run);
              }
              run = [];
            };
            for (let pi = 0; pi < pts.length; pi++) {
              const q = pts[pi];
              const pd = q[2];
              /* The skin's grid is a column down the trunk and says nothing finer than
                 that; a stroke riding the blade's face sits a blade's thickness proud of
                 the flank and reads as part of the fin.  Asked at the old hair's margin
                 the top stroke was cut to pieces the moment the flipper started to come
                 down - the flank drums in front of a root that is welded into it.  The
                 grid is kept only for the point that is genuinely buried, well behind the
                 skin, and the blade's own silhouette does the fine work. */
              const sk = gridCell(q[0], q[1]);
              let hide = sk !== null && pd >= sk + 8;
              if (!hide) {
                /* the ends of a stroke sit on the blade's margins, and a winding test
                   calls the outline itself outside.  Ask again a hand's width in along
                   the stroke, toward its own middle: the leading end then meets the line
                   it grows out of instead of stopping a gap short of it, and the shadow
                   of a stroke lying wholly on the edge still falls away. */
                let inn = inOwn(q[0], q[1]);
                if (!inn) {
                  const nb = pts[pi < pts.length / 2 ? Math.min(pi + 1, pts.length - 1) : Math.max(pi - 1, 0)];
                  const ex = nb[0] - q[0], ey = nb[1] - q[1], el = Math.hypot(ex, ey) || 1;
                  inn = inOwn(q[0] + ex / el * .6, q[1] + ey / el * .6);
                }
                if (!inn) hide = true;
              }
              if (!hide && ci) {
                /* The far blade is the one the body stands in front of, and the trunk's
                   outline is what says so: a stroke of it that falls inside the animal's
                   own silhouette is behind the near flank, and no paint covers it - the
                   body is drawn as its line, not as a fill.  Left to the depth grid it
                   came back as a stray dash on the back and, at another phase, as a row
                   of folds across the belly, wherever a cell read no skin.  Outside the
                   outline the far blade is a fin like any other, and keeps its strokes. */
                hide = (bodyRing && inPoly(bodyRing, q[0], q[1]))
                  || inTris(q, pd, pecNearTris) || behindFin(q[0], q[1], pd);
              }
              if (hide) { flush(); continue; }
              run.push(q);
            }
            flush();
          }
        }
        finCreases[ci][i].setAttribute("d", chainD(out));
      }
    }
    /* swallowed: the fin lands inside the painted union, so the frame's own contour never
       walks it and its line has to be drawn here.  One hairline, down the plate's centre
       sheet - the line the reference draws, and the line the flippers take.  It used to be
       drawn per face, each margin up to the crest: from up here the blade is all but
       edge-on, the two of them stand a calibre apart and arrive as a V joined at the tip,
       which the eye reads as a leaf pinned to the back with a hook off its point.
       The stroke is the blade's own ink, and it is not trimmed at the outline.  A fin is
       rooted in the back, and the stroke has to say so: it leaves the back above the
       frame's line, goes round the crest, comes back down and meets that line on the other
       side, and both ends stop there, a hair into the skin.  Trimmed at the line
       instead - which is what it did - the fin could only read as a shape behind the
       animal's own edge, since ink that stops dead on an outline is ink on the far side of
       it.  The frame is cut behind the blade to match (see the cuts, above), so its ends
       sit on the blade's ink and the plate stands in front of the line it is planted on. */
    if (!dorsThin && dorsSwallowed) {
      const dpts = dorsInk ? dorsInk.pts : [];
      const dkeep = dorsInk ? dorsInk.keep : [];
      const footPt = dorsInk && dorsInk.footPt ? dorsInk.footPt : null;
      /* Ink that rides the frame from one foot to the other is not the blade's edge, it is
         the back's own line again: seen nearly edge-on the sheet's root lies along the
         ridge, and the traced mid sheet carries it about the loop - so the samples there
         read as "outside" by a hair and survive every depth test.  It is drawn twice, a
         fifth of a unit apart, and now that the frame is cut between the feet it is the
         only ink left on that stretch: a doubled line where there must be none.
         So the stretch the frame has just given up is cut out of the blade as well - the
         samples within a stroke of the arc the feet bound are dropped, and what is left of
         the blade is the crest, which is what the fin is. */
      const onBase = dorsInk && dorsInk.root ? dorsInk.root : new Uint8Array(dpts.length);
      /* the runs of drawn ink, as index ranges: the shape is read once here, and the two
         ends that meet the back are then carried onto it (below) */
      const runs = [];
      if (dorsInk) {
        for (let i = 0; i < dpts.length; i++) {
          if (!dkeep[i] || onBase[i]) continue;
          let j = i;
          while (j + 1 < dpts.length && dkeep[j + 1] && !onBase[j + 1]) j++;
          if (j > i) runs.push([i, j]);
          i = j;
        }
      }
      /* The blade's ink ends on the back at both feet, and exactly there.  Left to the
         samples, it stops wherever the last one before the skin fell: out along the ridge
         the mid sheet is sampled every half unit and the joint closes to a hair, but the
         sheet dives deep on its way into the flank and its samples thin to two or three
         units apart, which is a hand's width of daylight between the fin's edge and the
         back it stands on.  So each end is walked to the crossing itself - the point where
         this very stroke cuts the frame, read above - and a hair past it, so the joint is
         closed against the grain the line is drawn with.
         Nothing is laid across the base between them.  Straight or bowed into the blade,
         a chord there is only a second line along the back under the fin, which is what
         the open base is for: the fin grows out of the animal, and the back's own line
         stops against its edges rather than being chorded behind it. */
      const NU = dpts.length - 1;
      const at = (u) => {
        const i = Math.max(0, Math.min(NU - 1, Math.floor(u)));
        const f = u - i, a = dpts[i], b = dpts[i + 1];
        return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
      };
      const feet = dorsInk && dorsInk.feet && dpts.length > 1
        ? [Math.max(0, Math.min(NU, dorsInk.feet[0])), Math.max(0, Math.min(NU, dorsInk.feet[1]))]
        : null;
      const fpt = footPt;
      const strokes = [];
      if (feet) for (const [r0, r1] of runs) {
        let lo = r0, hi = r1;
        /* an end that ran inboard of the crossing - the hair kept past the line, or the
           sunken run the grid read as ink - is pulled back to it */
        if (feet[0] > lo && feet[0] < hi) lo = feet[0];
        if (feet[1] < hi && feet[1] > lo) hi = feet[1];
        const s = [];
        for (let i = Math.ceil(lo); i <= Math.floor(hi); i++) s.push([dpts[i][0], dpts[i][1]]);
        /* and each end that stops short of the line is carried out onto the crossing,
           a hair past it - well under a stroke - so the two strokes meet rather than
           almost meet, and the blade's line is still the one that crosses */
        const past = (p, q) => {
          let dx = q[0] - p[0], dy = q[1] - p[1];
          const L = Math.hypot(dx, dy);
          if (L > 1e-6) { dx /= L; dy /= L; } else { dx = 0; dy = 0; }
          return [p[0] - dx * .35, p[1] - dy * .35];
        };
        /* a foot read off the line rather than off a crossing is one the stroke stops
           short of: the end is carried the last hair onto the frame, and a hair past it,
           so the blade is planted in the back instead of hovering over it.  The run is at
           most a couple of units, and it goes on in the direction the stroke was already
           heading, so it reads as the stroke continuing, not as a spur.
           Which foot is which is read off this run, not kept from the sheet: the traced
           loop runs down the leading edge, round the crest, back down the trailing edge
           and then once more along the root - so the first and last samples of it are not
           the two ends of the blade, and a foot paired to the wrong one draws a stroke
           straight across the fin.  The pairing is the one that leaves both feet nearest
           the two ends it is actually drawn between. */
        let FA = fpt && fpt[0] ? fpt[0] : null, FB = fpt && fpt[1] ? fpt[1] : null;
        if (s.length > 1 && FA && FB) {
          const d = (p, F) => Math.hypot(p[0] - F[0], p[1] - F[1]);
          const p0 = s[0], p1 = s[s.length - 1];
          if (d(p0, FB) + d(p1, FA) < d(p0, FA) + d(p1, FB)) { const t = FA; FA = FB; FB = t; }
          if (d(p0, FA) > 4.2) FA = null;
          if (d(p1, FB) > 4.2) FB = null;
        }
        /* The frame's own cut ends - the two points where this very ink crosses the back's
           line.  A foot read off a knot of crossings leaves no projected point behind, and
           the stroke then stopped in the open a unit or two short of the line it had just
           been cut against: a gap at the joint the cut exists to close, with the back's
           line ending on one side of it and the fin's edge beginning on the other.  The
           crossings are exactly where the two strokes are meant to meet, so the ends are
           walked onto them.  Only within a stroke or two: further than that and the point
           is not this end's joint at all. */
        if (!FA || !FB) {
          const fk = fpt && fpt.length ? fpt.filter(Boolean) : [];
          const near = (p) => {
            if (!p) return null;
            let best = null, bd = 2.6;
            for (const F of fk) {
              const dd = Math.hypot(p[0] - F[0], p[1] - F[1]);
              if (dd < bd) { bd = dd; best = F; }
            }
            return best;
          };
          if (!FA) FA = near(s[0]);
          if (!FB) FB = near(s[s.length - 1]);
          if (FA && FB && Math.hypot(FA[0] - FB[0], FA[1] - FB[1]) < .01) FB = null;
        }
        /* the end carried onto the joint, and a hair past it: past along the back's own
           tangent where the foot was read off a crossing (the missing stretch is a piece
           of that line), along the ink's heading where it was projected onto the frame
           (there the ink already reaches it). */
        const ftan = dorsInk.footTan || null;
        const reach = (F, p, g) => {
          let t = null;
          if (ftan && fpt && fpt[0]) {
            const d0 = Math.hypot(F[0] - fpt[0][0], F[1] - fpt[0][1]);
            const d1 = fpt[1] ? Math.hypot(F[0] - fpt[1][0], F[1] - fpt[1][1]) : 1e9;
            t = (d0 <= d1 ? ftan[0] : ftan[1]) || null;
          }
          const dx = F[0] - p[0], dy = F[1] - p[1], L = Math.hypot(dx, dy) || 1;
          const sg = t ? ((dx * t[0] + dy * t[1]) >= 0 ? 1 : -1) : 0;
          const ox = t ? F[0] + t[0] * sg * g : F[0] + dx / L * g;
          const oy = t ? F[1] + t[1] * sg * g : F[1] + dy / L * g;
          return [[ox, oy], [F[0], F[1]]];
        };
        if (FA) {
          const q = reach(FA, s.length ? s[0] : at(hi), .35 + (dorsInk.footGap || 0));
          s.unshift(q[0], q[1]);
        } else if (feet[0] > lo - 3 && feet[0] <= lo + 1e-6) {
          const p = at(feet[0]);
          s.unshift(past(p, s.length ? s[0] : at(hi)), p);
        }
        if (FB) {
          const q = reach(FB, s.length ? s[s.length - 1] : at(lo), .35);
          s.push(q[1], q[0]);
        } else if (feet[1] < hi + 3 && feet[1] >= hi - 1e-6) {
          const p = at(feet[1]);
          s.push(p, past(p, s.length ? s[s.length - 1] : at(lo)));
        }
        if (s.length > 1) strokes.push(s);
      }
      if (!feet) for (const [r0, r1] of runs) {
        const s = dpts.slice(r0, r1 + 1).map((q) => [q[0], q[1]]);
        if (s.length > 1) strokes.push(s);
      }
      /* drawn as the same open Catmull-Rom every other stroke here is: the ink comes off
         the traced sheet a sample at a time, and laid down as a polyline its facets stand
         against the flowing line of the back it grows out of - a fin cut from card, not
         one drawn in the same hand.  Smoothed, the crest rounds and the two ends still
         land where they were put. */
      /* A foot read off the line rather than off a crossing leaves the ink standing on
         its own last samples, which sit out beyond the joint in the open air: two units
         of stroke poking past the back, and the joint then reads as a bump with a notch
         in front of it - the one stretch of the drawing that must be a single flowing
         line.  An end further from its foot than the sample behind it is that run-out,
         not the blade, and it goes. */
      if (fpt && fpt.length) {
        const dFoot = (p) => {
          let b = 1e9;
          for (const F of fpt) if (F) { const d = Math.hypot(p[0] - F[0], p[1] - F[1]); if (d < b) b = d; }
          return b;
        };
        for (const s of strokes) {
          for (let n = 0; n < 4 && s.length > 6 && dFoot(s[0]) > dFoot(s[1]) + .25; n++) s.shift();
          for (let n = 0; n < 4 && s.length > 6 && dFoot(s[s.length - 1]) > dFoot(s[s.length - 2]) + .25; n++) s.pop();
        }
      }
      dorsOut.setAttribute("d", chainD(strokes.map((s) => crOpen(s)).join("")));
    } else dorsOut.setAttribute("d", dorsThin ? chainD(dorsD) : "");
    /* the inner margin belongs to the case where the frame draws the fin: there the two
       faces part widely enough to read as a plate, and the far one's margin is the line
       that says so.  Swallowed, there is nothing to be inside of - the single mid stroke
       above is the whole of the fin's ink. */
    if (!dorsSwallowed) {
      let d = "", run = [];
      const flush = () => { if (run.length > 1) d += crOpen(run); run = []; };
      for (const b of dorsEdgeBits) {
        const pd = dep([b[2], b[3], b[4]]);
        const sk = gridCell(b[0], b[1]);
        if (sk !== null && pd >= sk + .8) { flush(); continue; }
        run.push([b[0], b[1]]);
      }
      flush();
      dorsEdgeOut.setAttribute("d", chainD(d));
    } else dorsEdgeOut.setAttribute("d", "");
    /* the fluke's edge-on case is the side view: it lies in the horizontal plane, so the
       faces fall together only when the sight line drops right into that plane - a much
       narrower window than the dorsal's, whose plane the eye can cross a good fifteen
       degrees either side of dead ahead before the two margins part */
    const flkThin = Math.abs(VD[2]) < .05;
    /* the plate's edge is the frame's own line now: painting it a second time here would
       lay a darker copy of the same curve beside it, and where the two disagree by a
       fraction of a pixel the pair reads as a doubled stroke */
    flkOut.setAttribute("d", "");
  };

  /* The hand carries the view, the way airplane's does: sideways turns the whale about its
     upright axis - right round, with no stop at the quarter - and up and down rolls it over
     from the plan view through the side to the belly and back.  Both feed the springs' own
     targets, and neither answers the pointer until a hand is down - hovering leaves the
     view exactly where it rests, and the blades beat instead. */
  /* The rest pose is the three-quarter view the frame was fitted for: the plate reads
     as a body with a back and a flank, not as the flat plan it used to open on. The
     hand still rolls it all the way to the plan (k = 1) and over to the belly. */
  const k = spring(.45), az = spring(32);
  const YAW = .9, ROLL = .0045;              /* degrees per px sideways, k per px up and down */
  let drag = null;
  /* The blades' beat, laid over the same frame loop.  `beat` is not an angle but an
     envelope - nought with the pointer away, one under it - carried by a spring so the
     flippers pick the stroke up and set it down again instead of snapping on and off; the
     phase itself free-runs, so a pointer that comes and goes never restarts the beat
       mid-stroke.  BEAT is radians a second: 2.8 is a stroke of a little over two seconds -
       a big, slow scull of the flippers, the animal holding station in no hurry.  The
       flippers take the swing (BEAT_PEC); the same phase runs the body's wave (SWIM.ph),
       so the tail is the far end of the stroke rather than a beat of its own. */
  const beat = spring(0, { k: 60, c: 14 });
  let beatPh = 0;
  const BEAT = 2.8, BEAT_PEC = .22;
  /* ---- blowhole spout ----
     A press anywhere on the whale blows a plume of water straight up; releasing lets it
     fall and dissipate.  The blowhole sits at station 200 on the dorsal midline, where
     the two traced slits are; its screen spot is read each frame after draw().  Droplets
     are simple ballistic points with a little spread and gravity, drawn as one compound
     path so they stay a single hairline-weight fill.  `blowing` is set by the pointer;
     the drag that turns the whale is never blocked by it. */
  let blowing = false;
  let blowUntil = 0;                      /* the holes stay open at least this long after a tap */
  const droplets = [];
  /* How far the slits have opened: 0 is the drawn line, 1 the full naris.  A spring, so a
     release closes the naris back onto the line instead of switching it off. */
  const hole = spring(0, { k: 240, c: 30 });
  const spoutP3 = [0, 0, 0];
  const SPAWN = 7;                        /* droplets per frame while blowing */
  const GRAV = 90;                        /* screen units / s^2 downward */
  /* ---- the two nares ----
     The plan already draws the blowhole: a pair of thin slits that meet just aft of the
     rostrum and splay outward toward the tail, the shape the character 八 makes.  They
     are read here as spines in the plan's own coordinates - px along the body, py across
     it - so the open naris grows straight out of its drawn slit instead of sitting on top
     of it as an oval.  Five stations carry each spine; the opening lifts off its line
     outboard only, fullest at the waist and drawn to a point at both tips, so the two
     halves part like a whale's nares and can never cross each other. */
  const BLOW_X = 218.5;                   /* station at the pair's own centre */
  const NARIS_X = [198.6, 208.5, 219, 229.3, 238.1];
  const NARIS_OFF = [.52, .84, 1.36, 6.4, 11.8];
  const NARIS_MID = 214.5;                /* the plan's own mid-line between the two slits */
  const NARIS_GAP = 3.2;                  /* the septum held open between the pair, in plan px */
  const NARIS_W = 7.6;                    /* how far the open naris lifts, in plan px */
  const blowholeXY = () => { surf(BLOW_X, 0, spoutP3); return P(spoutP3[0], spoutP3[1], spoutP3[2]); };
  /* the spine: a Catmull-Rom through the five stations; `side` is -1 for the slit above
     the mid-line and +1 for the one below it */
  const spineAt = (side, t, o) => {
    const n = NARIS_X.length - 1, u = clamp(t, 0, 1) * n;
    const i = Math.min(n - 1, Math.floor(u)), f = u - i;
    const y = (j) => NARIS_MID + side * (NARIS_GAP + NARIS_OFF[clamp(j, 0, n)]);
    const p0 = y(i - 1), p1 = y(i), p2 = y(i + 1), p3 = y(i + 2);
    o[0] = NARIS_X[i] + (NARIS_X[i + 1] - NARIS_X[i]) * f;
    o[1] = .5 * (2 * p1 + (p2 - p0) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f +
                 (3 * p1 - p0 - 3 * p2 + p3) * f * f * f);
    return o;
  };
  const nq = [0, 0], nqA = [0, 0], nqB = [0, 0];
  const narisPath = (side, grow) => {
    const N = 22, bO = [0, 0, 0];
    let out = "";
    /* out along the lifted edge, front tip to rear tip, then back along the drawn line */
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i <= N; i++) {
        const t = pass ? 1 - i / N : i / N;
        spineAt(side, t, nq);
        spineAt(side, Math.min(1, t + .02), nqA);
        spineAt(side, Math.max(0, t - .02), nqB);
        const tx = nqA[0] - nqB[0], ty = nqA[1] - nqB[1];
        const tl = Math.hypot(tx, ty) || 1;
        let nx = -ty / tl, ny = tx / tl;
        if (ny * side < 0) { nx = -nx; ny = -ny; }   /* outboard: away from the mid-line */
        const s = Math.sin(Math.PI * t);
        const w = NARIS_W * Math.pow(s, .7) * (.8 + .4 * t) * grow;
        /* one-sided: the drawn slit itself is the medial lip of the opening, so the pair
           parts outward and can never cross into the X the old ovals made */
        const d = pass ? 0 : w;
        const px = nq[0] + nx * d, py = nq[1] + ny * d;
        const ct = PTs(px);

// Bianzhong: two tiers of bronze chime bells hung from a wooden rack, graded large to small, each
// studded with bosses. Hover names a bell's note; a press (or a held slide) strikes it: it swings and rings.
// A hold off the bells turns the whole rack round, as in a 3D viewer.

  const bag = disposer();

    // the far slab first. Within a rigid slab, centre depth orders the cubies.
    const far = eye[cur.axis] > 0 ? 1 : -1;
    [...cubies].sort((p, q) => (p.ix[cur.axis] - q.ix[cur.axis]) * far || p.d - q.d)
      .forEach((c) => g.appendChild(c.el));
  }
  draw(true);

  // One slice at a time: a new slice waits until the turning one has landed.
  function settle() {
    if (want.axis === cur.axis && want.idx === cur.idx) return false;
    if (turning) return true;
    cur = { axis: want.axis, idx: want.idx };
    draw(true);
    spinReq = inside ? want.dir : 0;
    return true;
  }

  const loop = register(stage, (dt, now) => {
    if (spinReq) { tset(spin, spin.to + (spinReq * Math.PI) / 2, now, 0); spinReq = 0; }
    turning = !tdone(spin, now);
    // A landed quarter is kept: the slice's cubies take their new places and turns.
    if (!turning && spin.to) {
      for (const c of cubies) if (c.ix[cur.axis] === cur.idx) {
        c.ix = round(rot(c.ix, cur.axis, spin.to));
        c.m = c.m.map((v) => round(rot(v, cur.axis, spin.to)));
      }
      spin = tween(0);
      draw(true);
    }
    const pending = settle();
    spinA = tval(spin, now);
    draw(false);
    return pending || turning;
  });
  bag.add(loop.unregister);

  // The cubie face under the pointer on the cube at rest (rule 01).
  function pick(sx, sy) {
    const cell = (v) => clamp(Math.floor((v + L) / Q), 0, 2) - 1;
    const [tx, ty] = unproj(C, sx, sy, 2 * L);
    if (Math.abs(tx) <= L && Math.abs(ty) <= L) return { face: 2, i: cell(tx), j: cell(ty), k: 1 };
    const a0 = unproj(C, sx, sy, 0), a1 = unproj(C, sx, sy, 2 * L);
    for (const axis of [0, 1]) {
      const t = (L - a0[axis]) / (a1[axis] - a0[axis]);
      if (!(t >= 0 && t <= 1)) continue;
      const o = a0[1 - axis] + (a1[1 - axis] - a0[1 - axis]) * t;
      if (Math.abs(o) > L) continue;
      const k = clamp(Math.floor(t * 3), 0, 2) - 1;
      return axis === 0 ? { face: 0, i: 1, j: cell(o), k } : { face: 1, i: cell(o), j: 1, k };
    }
    return null;
  }

  let last = null, ax = 0, ay = 0, mode = "h", markEl = cubie(1, 1, 1).sil;
  markEl.classList.add("hi");
  function mark(el) {
    if (el !== markEl) { markEl.classList.remove("hi"); (markEl = el).classList.add("hi"); }
  }
  function move([x, y]) {
    const hit = pick(x, y);
    if (!hit) return leave();
    if (last) {
      ax = ax * 0.8 + Math.abs(x - last[0]);
      ay = ay * 0.8 + Math.abs(y - last[1]);
      if (ax > ay * 1.4 && ax > 2 / reach) mode = "h"; // intensity: how soon a drag counts
      else if (ay > ax * 1.4 && ay > 2 / reach) mode = "v";
    }
    last = [x, y];
    let axis, idx, u, name;
    if (mode === "h") [axis, idx, u, name] = [2, hit.k, (x - 200) / 90, ["base", "mid", "top"][hit.k + 1]];
    else if (hit.face === 0) [axis, idx, u, name] = [1, hit.j, (y - 166) / 90, `col ${hit.j + 2}`];
    else [axis, idx, u, name] = [0, hit.i, (166 - y) / 90, `row ${hit.i + 2}`];
    want = { axis, idx, dir: u < 0 ? -1 : 1 }; // the pointer's side picks the way
    // Arriving on the rest layer spins it here; other slices spin in settle().
    if (!inside && (inside = true) && axis === cur.axis && idx === cur.idx) spinReq = want.dir;
    // The bright edge goes to the slice's nearest cubie.
    const near = cubies.filter((c) => c.ix[axis] === idx).reduce((b, c) =>
      c.ix[0] + c.ix[1] + c.ix[2] > b.ix[0] + b.ix[1] + b.ix[2] ? c : b);
    mark(near.sil);
    read.textContent = name;
    loop.wake();
  }
  function leave() {
    inside = false; last = null; ax = ay = 0; mode = "h";
    mark(cubie(1, 1, 1).sil);
    read.textContent = "rest";
    loop.wake();
  }

  bag.add(pointer(stage, { move, leave }));
  bag.add(() => svg.replaceChildren());
  read.textContent = "rest";

  return {
    set(v) { reach = v; },
    destroy: bag.dispose,
  };
}

});
